[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartographer"
version = "0.1.0"
description = "Compare what a repository's imports declare against what its git history reveals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hammasbuilds" }]
keywords = ["code analysis", "import graph", "co-change", "logical coupling", "git history", "architecture"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies. `ast` reads the source, `git log` reads the history.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cartographer = "cartographer.cli:main"

[project.urls]
Homepage = "https://github.com/hammasbuilds/cartographer"

[tool.hatch.build.targets.wheel]
packages = ["src/cartographer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
